[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The deploy script records deployments into deployments/chain.json
# (vm.writeJson) and its test reads/writes a scratch record under out/.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./out" },
]
